name: LinkageLens

description: Find Java dependency and binary-linkage problems before the JVM does.
author: LinkageLens contributors

inputs:
  path:
    description: JAR, class directory, or directory to scan
    required: true
  classpath-file:
    description: Optional file containing an OS-separated runtime classpath
    required: false
    default: ''
  fail-on:
    description: Severity threshold that fails the step
    required: false
    default: HIGH
  sarif:
    description: Also generate linkagelens.sarif
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Build LinkageLens action runtime
      shell: bash
      run: "${{ github.action_path }}/build.sh"

    - name: Run LinkageLens
      shell: bash
      env:
        LL_PATH: ${{ inputs.path }}
        LL_CP_FILE: ${{ inputs.classpath-file }}
        LL_FAIL_ON: ${{ inputs.fail-on }}
        LL_SARIF: ${{ inputs.sarif }}
      run: |
        args=(scan "$GITHUB_WORKSPACE/$LL_PATH" --fail-on "$LL_FAIL_ON")
        if [[ -n "$LL_CP_FILE" ]]; then
          args+=(--classpath-file "$GITHUB_WORKSPACE/$LL_CP_FILE")
        fi
        if [[ "$LL_SARIF" == "true" ]]; then
          java -jar "${{ github.action_path }}/dist/linkagelens.jar" "${args[@]}" --format sarif --output "$GITHUB_WORKSPACE/linkagelens.sarif"
        else
          java -jar "${{ github.action_path }}/dist/linkagelens.jar" "${args[@]}"
        fi
