name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        run: ./build.sh

      - name: Smoke-test CLI and report formats
        run: |
          java -jar dist/linkagelens.jar rules
          java -jar dist/linkagelens.jar scan dist/linkagelens.jar --format json --output /tmp/linkagelens.json
          java -jar dist/linkagelens.jar scan dist/linkagelens.jar --format sarif --output /tmp/linkagelens.sarif
          python3 - <<'PY'
          import json
          json.load(open('/tmp/linkagelens.json'))
          json.load(open('/tmp/linkagelens.sarif'))
          print('JSON and SARIF validated')
          PY
