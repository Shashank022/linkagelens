name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test LinkageLens CLI
        run: ./build.sh

      - name: Smoke-test CLI
        run: |
          java -jar dist/linkagelens.jar rules
          java -jar dist/linkagelens.jar scan dist/linkagelens.jar --format json --output /tmp/linkagelens.json
          java -jar dist/linkagelens.jar scan dist/linkagelens.jar --format sarif --output /tmp/linkagelens.sarif
          python3 - <<'PY'
          import json
          json.load(open('/tmp/linkagelens.json'))
          json.load(open('/tmp/linkagelens.sarif'))
          print('CLI JSON and SARIF validated')
          PY

      - name: Install LinkageLens Maven plugin
        run: mvn -B -ntp -f maven-plugin/pom.xml install

      - name: Install LinkageLens Maven extension
        run: mvn -B -ntp -f maven-extension/pom.xml install

      - name: Verify automatic Maven Guardian
        run: ./scripts/test-maven-extension.sh
