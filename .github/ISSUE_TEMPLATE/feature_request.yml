name: Rule or feature request
description: Propose a JVM linkage scenario LinkageLens should detect.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What runtime/linkage failure is difficult to detect today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: JVM/binary evidence
      description: What deterministic evidence could LinkageLens inspect?
    validations:
      required: true
